name: operational-readiness-unlock-quorum

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/operational-readiness-unlock-quorum.yml'
      - 'tests/operational-readiness/unlock-quorum-probe.py'
      - 'tests/operational-readiness/local-swarm-status.go'
      - 'tests/operational-readiness/recovery-diagnostics.py'

concurrency:
  group: operational-readiness-three-manager
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unlock-quorum-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCKLANE_OR_DISPOSABLE_HOST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify deterministic preflight
        run: |
          python3 -m py_compile tests/operational-readiness/unlock-quorum-probe.py tests/operational-readiness/recovery-diagnostics.py
          python3 tests/operational-readiness/unlock-quorum-probe-test.py
      - name: Build and verify local Swarm status reader
        run: |
          test -z "$(gofmt -l tests/operational-readiness/local-swarm-status.go)"
          python3 tests/operational-readiness/local-swarm-status-test.py
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/docklane-local-swarm-status" tests/operational-readiness/local-swarm-status.go
          test -x "$RUNNER_TEMP/docklane-local-swarm-status"
      - name: Run differential probe (not backup acceptance)
        env:
          DOCKLANE_OR_LOG_DIR: ${{ runner.temp }}/docklane-unlock-quorum-probe
          DOCKLANE_OR_LOCAL_STATE_HELPER: ${{ runner.temp }}/docklane-local-swarm-status
        run: python3 tests/operational-readiness/unlock-quorum-probe.py
      - name: Cleanup owned probe resources
        if: always()
        env:
          DOCKLANE_OR_LOG_DIR: ${{ runner.temp }}/docklane-unlock-quorum-probe
        run: python3 tests/operational-readiness/unlock-quorum-probe.py --cleanup-only
      - name: Upload sanitized probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docklane-unlock-quorum-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/docklane-unlock-quorum-probe/unlock-quorum-probe.json
            ${{ runner.temp }}/docklane-unlock-quorum-probe/unlock-quorum-pending.json
          if-no-files-found: error
          retention-days: 14
