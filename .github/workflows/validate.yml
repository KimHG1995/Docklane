name: validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      agent: ${{ steps.filter.outputs.agent }}
      docs: ${{ steps.filter.outputs.docs }}
      poc: ${{ steps.filter.outputs.poc }}
      any_runtime: ${{ steps.filter.outputs.any_runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          HEAD="${{ github.sha }}"

          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse "$HEAD^" 2>/dev/null || echo "$HEAD")"
          fi

          git diff --name-only "$BASE" "$HEAD" > /tmp/changed-files.txt
          cat /tmp/changed-files.txt

          api=false
          web=false
          agent=false
          docs=false
          poc=false
          unknown=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              apps/api/*)
                api=true
                ;;
              apps/web/*)
                web=true
                ;;
              agent/*)
                agent=true
                ;;
              contracts/*)
                api=true
                agent=true
                ;;
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.base.json)
                api=true
                web=true
                ;;
              .github/workflows/*)
                api=true
                web=true
                agent=true
                ;;
              tests/functional-poc/*)
                poc=true
                ;;
              docs/*|README.md|CONTRIBUTING.md|SECURITY.md|LICENSE)
                docs=true
                ;;
              *)
                unknown=true
                ;;
            esac
          done < /tmp/changed-files.txt

          # Unknown paths are validated conservatively until they are explicitly classified.
          if [[ "$unknown" == "true" ]]; then
            api=true
            web=true
            agent=true
          fi

          any_runtime=false
          if [[ "$api" == "true" || "$web" == "true" || "$agent" == "true" ]]; then
            any_runtime=true
          fi

          {
            echo "api=$api"
            echo "web=$web"
            echo "agent=$agent"
            echo "docs=$docs"
            echo "poc=$poc"
            echo "any_runtime=$any_runtime"
          } >> "$GITHUB_OUTPUT"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @docklane/api typecheck
      - run: pnpm --filter @docklane/api test
      - run: pnpm --filter @docklane/api build

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @docklane/web typecheck
      - run: pnpm --filter @docklane/web build

  go-agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go mod tidy
      - name: Verify Go module files are clean
        run: test -z "$(git status --porcelain -- go.mod go.sum)"
      - name: Verify gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/docklane-agent ./cmd/docklane-agent

  functional-poc-lint:
    needs: changes
    if: needs.changes.outputs.poc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Functional PoC syntax
        run: |
          bash -n tests/functional-poc/run.sh
          bash -n tests/functional-poc/cleanup.sh
          bash -n tests/functional-poc/three-node-topology.sh
          python3 -m py_compile tests/functional-poc/app/server.py
          python3 -m py_compile tests/functional-poc/agent-proxy.py
          python3 -m py_compile tests/functional-poc/agent-proxy-test.py
          bash -n tests/functional-poc/preflight-safety-test.sh
          bash -n tests/functional-poc/cleanup-retry-test.sh

      - name: Run Functional PoC harness regressions
        run: |
          bash tests/functional-poc/preflight-safety-test.sh
          bash tests/functional-poc/cleanup-retry-test.sh
          python3 tests/functional-poc/agent-proxy-test.py

  docs-only:
    needs: changes
    if: needs.changes.outputs.any_runtime != 'true' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Documentation-only change; runtime build and deployment validation skipped."

  validation-gate:
    if: always()
    needs: [changes, api, web, go-agent, functional-poc-lint, docs-only]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected jobs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change detection failed"
            exit 1
          fi

          for result in             "${{ needs.api.result }}"             "${{ needs.web.result }}"             "${{ needs.go-agent.result }}"             "${{ needs.functional-poc-lint.result }}"             "${{ needs.docs-only.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "A required validation job failed or was cancelled"
              exit 1
            fi
          done

          echo "Validation complete for the detected change scope."
