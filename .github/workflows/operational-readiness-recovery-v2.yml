name: operational-readiness-recovery-v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/operational-readiness-recovery-v2.yml'
      - 'tests/operational-readiness/trust-key-restore-v2.sh'

concurrency:
  group: operational-readiness-three-manager
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recovery-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify harness syntax
        run: bash -n tests/operational-readiness/trust-key-restore-v2.sh

      - name: Verify disposable Docker host
        run: |
          docker version
          docker info
          test "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "inactive"
          ! docker network inspect docklane-or-manager-net >/dev/null 2>&1

      - name: Run recovery drill
        env:
          DOCKLANE_OR_LOG_DIR: ${{ runner.temp }}/docklane-operational-readiness
          DOCKLANE_OR_PRIVATE_BACKUP_DIR: ${{ runner.temp }}/docklane-trust-backup-private-${{ github.run_id }}
        run: bash tests/operational-readiness/trust-key-restore-v2.sh

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docklane-operational-readiness-recovery-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/docklane-operational-readiness
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        env:
          DOCKLANE_OR_LOG_DIR: ${{ runner.temp }}/docklane-operational-readiness
          DOCKLANE_OR_PRIVATE_BACKUP_DIR: ${{ runner.temp }}/docklane-trust-backup-private-${{ github.run_id }}
        run: bash tests/operational-readiness/trust-key-restore-cleanup.sh
